<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>家計簿アプリ - 編集</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="
    background-image: url('/images/background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
">

<div class="container mt-4">

    <!-- タイトル -->
    <h2 class="text-center mb-4">
        家計簿アプリ
    </h2>

    <!-- カード -->
    <div class="card p-4 shadow">

        <h4 class="mb-4 text-center">
            データ編集
        </h4>

        <form th:action="@{/update}"
              th:object="${transaction}"
              method="post">

            <!-- ID -->
            <input type="hidden"
                   th:field="*{id}">

            <!-- 1行目 -->
            <div class="row mb-3 align-items-center">

                <!-- 日付 -->
                <div class="col-md-6">

					<input type="date"
					       th:field="*{date}"
					       th:value="${#temporals.format(transaction.date, 'yyyy-MM-dd')}"
					       class="form-control">

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('date')}"
                         th:errors="*{date}">
                    </div>
                </div>

                <!-- ラジオボタン -->
                <div class="col-md-6">

                    <div class="form-check form-check-inline">
                        <input class="form-check-input"
                               type="radio"
                               th:field="*{type}"
                               value="income">

                        <label class="form-check-label">
                            収入
                        </label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input"
                               type="radio"
                               th:field="*{type}"
                               value="expense">

                        <label class="form-check-label">
                            支出
                        </label>
                    </div>

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('type')}"
                         th:errors="*{type}">
                    </div>

                </div>

            </div>

            <!-- 2行目 -->
            <div class="row mb-3">

                <!-- 金額 -->
                <div class="col-md-6">

                    <input type="number"
                           th:field="*{amount}"
                           class="form-control"
                           placeholder="金額">

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('amount')}"
                         th:errors="*{amount}">
                    </div>
                </div>

                <!-- カテゴリ -->
                <div class="col-md-6">

                    <input type="text"
                           th:field="*{category}"
                           class="form-control"
                           placeholder="カテゴリ（給与/光熱費/食費 等）">

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('category')}"
                         th:errors="*{category}">
                    </div>
                </div>

            </div>

            <!-- 3行目 -->
            <div class="row align-items-center">

                <!-- メモ -->
                <div class="col-md-9">

                    <input type="text"
                           th:field="*{memo}"
                           class="form-control"
                           placeholder="メモ">

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('memo')}"
                         th:errors="*{memo}">
                    </div>
                </div>

                <!-- 更新ボタン -->
                <div class="col-md-3">
                    <button class="btn btn-warning w-100">
                        更新
                    </button>
                </div>

            </div>

        </form>

        <!-- 戻る -->
        <div class="mt-4">
            <a href="/"
               class="btn btn-secondary w-100">
                戻る
            </a>
        </div>

    </div>

</div>

</body>
</html>
