<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>編集</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="
    background-image: url('/images/background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
">

<div class="container mt-4">

    <h2 class="text-center mb-4">データ編集</h2>

    <div class="card p-4">

        <form action="/update" method="post">

            <!-- ID -->
            <input type="hidden"
                   name="id"
                   th:value="${transaction.id}">

            <!-- 1行目 -->
            <div class="row mb-3 align-items-center">

                <!-- 日付 -->
                <div class="col-md-6">
                    <input type="date"
                           name="date"
                           class="form-control"
                           th:value="${transaction.date}">
                </div>

                <!-- 種別 -->
                <div class="col-md-6">

                    <div class="form-check form-check-inline">
                        <input class="form-check-input"
                               type="radio"
                               name="type"
                               value="income"
                               th:checked="${transaction.type == 'income'}">

                        <label class="form-check-label">
                            収入
                        </label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input"
                               type="radio"
                               name="type"
                               value="expense"
                               th:checked="${transaction.type == 'expense'}">

                        <label class="form-check-label">
                            支出
                        </label>
                    </div>

                </div>

            </div>

            <!-- 2行目 -->
            <div class="row mb-3">

                <!-- 金額 -->
                <div class="col-md-6">
                    <input type="number"
                           name="amount"
                           class="form-control"
                           placeholder="金額"
                           th:value="${transaction.amount}">
                </div>

                <!-- カテゴリ -->
                <div class="col-md-6">
                    <input type="text"
                           name="category"
                           class="form-control"
                           placeholder="カテゴリ"
                           th:value="${transaction.category}">
                </div>

            </div>

            <!-- 3行目 -->
            <div class="row align-items-center">

                <!-- メモ -->
                <div class="col-md-9">
                    <input type="text"
                           name="memo"
                           class="form-control"
                           placeholder="メモ"
                           th:value="${transaction.memo}">
                </div>

                <!-- 更新ボタン -->
                <div class="col-md-3">
                    <button class="btn btn-warning w-100">
                        更新
                    </button>
                </div>

            </div>

        </form>

        <!-- 戻る -->
        <div class="mt-3 text-center">
            <a href="/" class="btn btn-secondary">
                戻る
            </a>
        </div>

    </div>

</div>

</body>
</html>
